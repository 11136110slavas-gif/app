<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Культ тела</title>
<style>
:root{
  --bg:#0c0d10; --card:#16181d; --card2:#1d2027; --line:#262a33;
  --text:#f2f3f5; --mute:#8c93a1; --dim:#5d6370;
  --lime:#c6f432; --lime-d:#9cc21f; --ice:#5fd0ff; --ice-d:#2b8fd6; --warn:#ffb648; --red:#ff6b6b;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
#app{padding:16px 16px calc(96px + var(--safe-b));max-width:520px;margin:0 auto}
h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:750;letter-spacing:-.01em;margin:22px 0 10px}
h3{font-size:16px;font-weight:700}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card.tight{padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.hello .mute{font-size:14px;margin-bottom:2px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2a2f3a,#1a1d24);display:grid;place-items:center;font-weight:800;color:var(--lime);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--mute);font-weight:600}
.pill.lime{background:rgba(198,244,50,.12);color:var(--lime)} .pill.ice{background:rgba(95,208,255,.12);color:var(--ice)} .pill.warn{background:rgba(255,182,72,.13);color:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;background:var(--lime);color:#11140a;font-weight:750;font-size:16px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--text)} .btn.sm{height:42px;font-size:14px;border-radius:13px}
.btn.ice{background:var(--ice);color:#04202e}
.btn[disabled]{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:24px} .tile b{font-size:14px;font-weight:700} .tile span{font-size:12px;color:var(--mute)}
/* next visit */
.next{background:linear-gradient(140deg,#20262e 0%,#151920 60%);border:1px solid #2a3040}
.next .when{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.next .glow{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(198,244,50,.22),transparent 70%)}
/* abonement ring */
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .c b{font-size:24px;font-weight:800} .ring .c span{font-size:10px;color:var(--mute);display:block;margin-top:2px}
/* due */
.due{border:1px solid rgba(255,182,72,.35);background:linear-gradient(140deg,rgba(255,182,72,.10),var(--card) 60%)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,16,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);font-weight:600;flex:1;padding:4px 0}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--lime)}
/* water */
.water-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.bottle{width:190px;height:270px;position:relative}
.bottle .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.bottle .num b{font-size:44px;font-weight:850;letter-spacing:-.03em;line-height:1}
.bottle .num span{font-size:13px;color:#d9f3ff;margin-top:4px}
.wave{animation:wave 3.2s linear infinite}
.wave2{animation:wave 5s linear infinite reverse;opacity:.55}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
#waterLevel{transition:transform 1.1s cubic-bezier(.2,.9,.25,1.15)}
.bub{animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(calc(var(--d) * -1));opacity:.2}}
.drop{position:absolute;left:50%;top:-30px;font-size:30px;z-index:4;animation:drop .7s ease-in forwards;pointer-events:none}
@keyframes drop{0%{transform:translate(-50%,0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translate(-50%,190px) scale(1);opacity:0}}
.addw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.addw button{background:var(--card);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;transition:transform .1s}
.addw button:active{transform:scale(.93);background:#1c2a33}
.addw button i{font-style:normal;font-size:22px}
.addw button span{font-size:12px;color:var(--mute);font-weight:600}
.week{display:flex;justify-content:space-between;align-items:flex-end;height:96px;gap:8px;margin-top:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:26px;border-radius:8px;background:var(--card2);position:relative;overflow:hidden}
.week i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:linear-gradient(180deg,var(--ice),var(--ice-d));border-radius:8px}
.week i.full::after{background:linear-gradient(180deg,var(--lime),var(--lime-d))}
.week span{font-size:11px;color:var(--dim);font-weight:600}
.streak{display:flex;align-items:center;gap:12px}
.streak .fire{font-size:30px}
/* progress */
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.big-delta{font-size:36px;font-weight:850;letter-spacing:-.03em;line-height:1}
.chart{width:100%;height:170px;margin-top:10px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11px;color:var(--mute);font-weight:600;line-height:1.15}
.badge .b{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--card2);filter:grayscale(1);opacity:.35}
.badge.on .b{background:linear-gradient(140deg,#2c3a12,#1a2208);filter:none;opacity:1;box-shadow:inset 0 0 0 1px rgba(198,244,50,.35)}
.badge.on{color:var(--text)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border:0}
/* lists */
.list button,.list a{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;color:inherit;text-decoration:none}
.list>*:last-child{border-bottom:0}
.list .toggle{width:50px;height:30px;padding:0;border:0;display:block;flex:none}
.list .ic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.list .t{flex:1;min-width:0} .list .t b{display:block;font-size:15px;font-weight:700} .list .t span{font-size:12.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dim);font-size:20px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{list-style:none;display:flex;gap:12px;font-size:14.5px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:8px;background:var(--card2);color:var(--lime);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.ok li::before{content:"✓";color:var(--lime)}
.no li::before{content:"✕";color:var(--red)}
/* quiz */
.qprog{height:4px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0 22px}
.qprog i{display:block;height:100%;background:var(--lime);transition:width .35s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border-radius:16px;padding:16px;text-align:left;font-weight:650;display:flex;align-items:center;gap:12px;border:1.5px solid transparent;transition:all .15s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--lime);background:#1b2111}
.opt .e{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:13px;background:var(--card);font-size:14px;font-weight:650;border:1.5px solid transparent}
.chip.on{border-color:var(--lime);background:#1b2111;color:var(--lime)}
textarea{width:100%;min-height:80px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;resize:none;outline:none}
textarea:focus,input:focus{border-color:var(--lime-d)}
.result-hero{background:linear-gradient(150deg,#26310f,#151a0b 70%);border:1px solid rgba(198,244,50,.25)}
.plate{display:flex;gap:16px;align-items:center}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#15171c;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--safe-b));z-index:41;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:520px;margin:0 auto}
.sheet.open{transform:none} .sheet-bg.open{opacity:1}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#353a45;margin:0 auto 14px}
.numin{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 18px}
.numin input{width:150px;text-align:center;font-size:40px;font-weight:800;background:none;border:0;border-bottom:2px solid var(--line);outline:none;padding:4px}
.numin button{width:48px;height:48px;border-radius:50%;background:var(--card2);font-size:24px;font-weight:700}
.toggle{width:50px;height:30px;border-radius:15px;background:#343843;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--lime-d)} .toggle.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:#2a2f39;padding:12px 18px;border-radius:14px;font-weight:650;font-size:14px;opacity:0;transition:all .25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-weight:650;margin:0 0 14px;font-size:14px}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:70;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.skeleton{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#15171c,#1c1f25,#15171c);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .e{font-size:26px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
a{color:var(--ice)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Мини-приложение «Культ тела» для клиентов
   Настройка: вставьте ссылку на веб-приложение Apps Script в API_URL
   Тексты процедур, тестов и советов — ниже, в блоке «КОНТЕНТ»
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwzqtUYE9YgTfKFJOgjf9uwuO_ryJ5PixfXlXjWeZ7Iu_IbFpkJ6WkYg86wxpyaNh4s2w/exec';

/* ============================== КОНТЕНТ ============================== */
const PROCS = [
  { id:'kavi', cat:'Кави', name:'Кавитация', ic:'🔊', short:'Ультразвук разрушает жировые клетки: живот, бока, бёдра',
    interval:10, course:'Курс 6–10 процедур, раз в 7–10 дней',
    before:['За день до процедуры выпейте 1,5–2 л воды','Не ешьте плотно за 2 часа до визита'],
    after:['Пейте 2 л воды и больше 2–3 дня: так разрушенный жир выводится быстрее','Лучше всего в тот же день или назавтра сделать ЕМС или лимфодренаж','Вечером пройдитесь 30–40 минут быстрым шагом','2–3 дня без алкоголя, жирного и сладкого'],
    result:'Минус объём видно уже после 2–3 процедур' },
  { id:'krio', cat:'Крио', name:'Криолиполиз', ic:'❄️', short:'Холод убирает жировые ловушки за одну процедуру',
    interval:30, course:'Раз в месяц, на каждую зону',
    before:['Не ешьте плотно за 2 часа до визита','Возьмите удобную одежду, процедура длится около часа'],
    after:['Покраснение, онемение и лёгкий отёк зоны — это нормально, проходят за 1–3 недели','Несколько дней делайте лёгкий массаж зоны по 5 минут','3–5 дней без бани, сауны и горячей ванны','Пейте больше воды и больше двигайтесь'],
    result:'Первый результат через 3–4 недели, полный через 2–3 месяца',
    warn:'Если боль сильная или не проходит дольше недели, сразу напишите мне' },
  { id:'ems', cat:'Емс', name:'ЕМС тренировка мышц', ic:'⚡️', short:'Тысячи сокращений мышц за 30 минут: рельеф и пресс',
    interval:5, course:'Курс 4–8 процедур, 2 раза в неделю',
    before:['Перекусите за 1–1,5 часа: белок и немного углеводов'],
    after:['Мышцы могут ныть 1–2 дня, как после хорошей тренировки','Белок в каждом приёме пищи: мясо, рыба, яйца, творог','Не грузите в зале те же мышцы в этот день','Пейте 2 л воды'],
    result:'Плотность и рельеф заметны после 3–4 процедур' },
  { id:'lipo', cat:'Липолитики', name:'Липолитики', ic:'💉', short:'Уколы, которые растворяют жир в зоне',
    interval:14, course:'Курс 3–6 процедур, раз в 1–2 недели',
    before:['За 2 дня до процедуры без алкоголя','Не ешьте плотно за 2 часа до визита'],
    after:['Отёк, покраснение и жжение 1–3 дня — это нормально','В первый день не растирайте зону','2–3 дня без бани, сауны, бассейна и зала','3 дня без алкоголя, пейте 2 л воды'],
    result:'Результат виден через 1–2 недели после каждой процедуры',
    warn:'Если поднялась температура или боль усиливается, сразу напишите мне' },
  { id:'mezo', cat:'Мезо', name:'Мезотерапия', ic:'💧', short:'Коктейли под кожу: лицо и кожа головы против выпадения',
    interval:14, course:'Курс 4–8 процедур, раз в 1–2 недели',
    before:['За 2 дня до процедуры без алкоголя','Для кожи головы приходите с чистыми волосами'],
    after:['12–24 часа не трогайте зону руками, без косметики','Кожа головы: не мойте голову до следующего дня','2–3 дня без бани, сауны и бассейна','Неделю без загара и солярия'],
    result:'Лицо: свежесть сразу и нарастает с курсом. Волосы: результат через 2–3 месяца' },
  { id:'rf', cat:'Игольчатый RF', name:'Игольчатый RF-лифтинг', ic:'✨', short:'Подтяжка, рубцы, поры и рельеф кожи лица и тела',
    interval:30, course:'Курс 3–4 процедуры, раз в 4 недели',
    before:['За 2 недели без загара','За неделю без пилингов и скрабов'],
    after:['Покраснение и отёк 1–3 дня — это нормально','Первые сутки без горячей воды, косметики и рук на лице','SPF 30–50 каждый день 2 недели','3 дня без бани, сауны и зала, 2 недели без скрабов'],
    result:'Эффект нарастает 1–3 месяца после процедуры' },
  { id:'smas', cat:'SMAS', name:'SMAS-лифтинг', ic:'🔺', short:'Подтяжка овала лица, век и шеи без операции',
    interval:180, course:'1 процедура, поддержка через 6–12 месяцев',
    before:['Особой подготовки не нужно'],
    after:['Лёгкий отёк и чувствительность зоны несколько дней — это нормально','3 дня без бани и сауны','Пользуйтесь SPF'],
    result:'Подтяжка нарастает 2–3 месяца' },
  { id:'le', cat:'ЛЭ', name:'Лазерная эпиляция', ic:'🔆', short:'Убирает лишние волосы надолго: спина, грудь, лицо и другие зоны',
    interval:35, course:'Курс 6–10 процедур, раз в 4–8 недель',
    before:['Побрейте зону за день до визита','За 4 недели без воска, шугаринга и эпилятора — только бритьё','За 2 недели без загара'],
    after:['Покраснение — это нормально, пройдёт за несколько часов','2–3 дня без бани, сауны, бассейна и зала','2 недели без загара, SPF на открытые зоны','Волосы выпадают сами 1–3 недели: не выдёргивайте'],
    result:'Волос становится заметно меньше после каждой процедуры' },
  { id:'mass', cat:'Массаж', name:'Массаж и лимфодренаж', ic:'🤲', short:'Классика, спорт и лимфодренаж: тонус и минус отёки',
    interval:7, course:'Курс 5–10 сеансов, 1–2 раза в неделю',
    before:['Не ешьте плотно за час до сеанса'],
    after:['Выпейте стакан-два воды','1–2 часа без тяжёлой еды'],
    result:'Лёгкость и минус отёки сразу' },
  { id:'zoom', cat:'Отбеливание', name:'Отбеливание ZOOM', ic:'😁', short:'Белее на несколько тонов за одну процедуру',
    interval:365, course:'1 процедура, повтор через 1–2 года',
    before:['Сделайте чистку зубов у стоматолога заранее'],
    after:['48 часов «белая диета»: без кофе, чая, вина, ягод, соусов и сигарет','Чувствительность 1–2 дня — это нормально'],
    result:'Результат сразу после процедуры' }
];

function tgShim(){
  const hp = new URLSearchParams((location.hash||'').slice(1));
  let raw = hp.get('tgWebAppData') || '';
  try{ if(raw) sessionStorage.setItem('kt_init', raw); else raw = sessionStorage.getItem('kt_init') || ''; }catch(e){}
  if(!raw) return null;
  const q = new URLSearchParams(raw); let user = {};
  try{ user = JSON.parse(q.get('user')||'{}'); }catch(e){}
  const post = (type, data)=>{ try{
    if(window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data||{}));
    else if(window.external && window.external.notify) window.external.notify(JSON.stringify({eventType:type, eventData:data||{}}));
    else window.parent.postMessage(JSON.stringify({eventType:type, eventData:data||{}}), '*');
  }catch(e){} };
  let backCb = null;
  window.Telegram = window.Telegram || {};
  window.Telegram.WebView = window.Telegram.WebView || {};
  window.Telegram.WebView.receiveEvent = (ev)=>{ if(ev==='back_button_pressed' && backCb) backCb(); };
  window.addEventListener('message', (e)=>{ try{ const m = JSON.parse(e.data); if(m.eventType==='back_button_pressed' && backCb) backCb(); }catch(x){} });
  return {
    initData: raw, initDataUnsafe: { user: user, start_param: q.get('start_param') || '' },
    ready(){ post('web_app_ready'); }, expand(){ post('web_app_expand'); },
    setHeaderColor(c){ post('web_app_set_header_color', {color:c}); }, setBackgroundColor(c){ post('web_app_set_background_color', {color:c}); },
    disableVerticalSwipes(){ post('web_app_setup_swipe_behavior', {allow_vertical_swipe:false}); },
    openTelegramLink(u){ const path = u.replace(/^https?:\/\/t\.me/, ''); if(window.TelegramWebviewProxy || window.parent!==window) post('web_app_open_tg_link', {path_full: path}); else location.href = u; },
    BackButton: { onClick(f){ backCb = f; }, show(){ post('web_app_setup_back_button', {is_visible:true}); }, hide(){ post('web_app_setup_back_button', {is_visible:false}); } },
    HapticFeedback: { impactOccurred(s){ post('web_app_trigger_haptic_feedback', {type:'impact', impact_style:s}); }, notificationOccurred(s){ post('web_app_trigger_haptic_feedback', {type:'notification', notification_type:s}); }, selectionChanged(){ post('web_app_trigger_haptic_feedback', {type:'selection_change'}); } }
  };
}

function pd(s){ return new Date(s+'T12:00:00'); }
function dayDiff(s){ return Math.round((pd(s) - pd(today_())) / 864e5); }
function human(s){ const n=dayDiff(s); const d=pd(s);
  if(n===0) return 'Сегодня'; if(n===1) return 'Завтра'; if(n===2) return 'Послезавтра';
  return WDF[d.getDay()][0].toUpperCase()+WDF[d.getDay()].slice(1)+', '+d.getDate()+' '+MON[d.getMonth()]; }
function short(s){ const d=pd(s); return d.getDate()+' '+MON[d.getMonth()].slice(0,3); }
function plural(n,a,b,c){ n=Math.abs(n)%100; const m=n%10; if(n>10&&n<20) return c; if(m>1&&m<5) return b; if(m===1) return a; return c; }

function addWater(ml){
  const w=S.water; if(ml<0&&w.today<=0) return;
  const was=w.today; w.today=Math.max(0,w.today+ml); haptic(ml>0?'medium':'light');
  if(ml>0){ const d=document.createElement('div'); d.className='drop'; d.textContent='💧'; $('#bottle').appendChild(d); setTimeout(()=>d.remove(),800); }
  const pct=Math.min(1,w.today/w.goal);
  $('#waterLevel').style.transform=`translateY(${(1-pct)*250+8}px)`;
  countUp($('#wnum'), was, w.today);
  $('#bottle .num span').textContent='мл · '+Math.round(pct*100)+'%';
  $('#wleft').textContent = w.today>=w.goal?'Норма на сегодня выполнена 🎉':'Осталось '+(w.goal-w.today)+' мл';
  const tw=w.week[w.week.length-1]; if(tw&&tw.d===today_()) tw.ml=w.today;
  if(was<w.goal*.9 && w.today>=w.goal*.9){ w.streak++; w.best=Math.max(w.best||0,w.streak); setTimeout(()=>{confetti();haptic('ok');toast('Норма выполнена! '+w.streak+' '+plural(w.streak,'день','дня','дней')+' подряд');},500); }
  wQueue+=ml; clearTimeout(wTimer); wTimer=setTimeout(flushWater,900);
}

function achievements(){ const g=['start'], w=S.water, c=S.client||{}, v=c.visits||0;

   <div class="card"><h3>Главное</h3><ul class="steps" style="margin-top:12px">${R.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   ${extra.length?`<div class="card"><h3>Именно вам</h3><ul class="steps ok" style="margin-top:12px">${extra.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
   <button class="btn ghost" onclick="startFood()">Пройти заново</button>`; }
function plateSvg(goal){ const third=goal==='dry'||goal==='mass';
  const seg=(a0,a1,c)=>{ const r=44,cx=50,cy=50,p=(a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)]; const [x0,y0]=p(a0),[x1,y1]=p(a1); return `<path d="M50 50 L${x0} ${y0} A44 44 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z" fill="${c}"/>`; };
  const T=Math.PI*2, s=-Math.PI/2;
  const parts = third ? [[0,1/3,'#c6f432'],[1/3,2/3,'#5fd0ff'],[2/3,1,'#ffb648']] : [[0,.5,'#c6f432'],[.5,.75,'#5fd0ff'],[.75,1,'#ffb648']];
  return `<svg width="100" height="100" viewBox="0 0 100 100" style="flex:none"><circle cx="50" cy="50" r="49" fill="#262a33"/>${parts.map(([a,b,c])=>seg(s+a*T,s+b*T,c)).join('')}<circle cx="50" cy="50" r="16" fill="#16181d"/></svg>`; }

function startBook(o){ o=o||{}; const c=S.client;
  const last = c&&c.last ? (c.last.cat||catOf(c.last.proc)) : null;
  book={ cat:o.cat||last||null, days:[], time:null, comment:o.comment||'', reschedule:!!o.reschedule, next:!!o.next, wait:false, done:false };
  page='book'; render(); window.scrollTo(0,0); }
function suggestDate(){ const c=S.client, cat=book&&book.cat, iv=(S.intervals||{})[cat] || (procBy(cat)||{}).interval;
  if(!c||!c.last||!iv) return ''; const d=new Date(pd(c.last.date).getTime()+iv*864e5); const s=d.toISOString().slice(0,10);
  return dayDiff(s)>0 ? s : 'now'; }

  if(tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor('#0c0d10'); tg.setBackgroundColor('#0c0d10'); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.BackButton.onClick(()=>{ if(document.querySelector('#sheet.open')) return closeSheet(); if(quiz) return quizBack(); if(sub&&page==='care') return go('care'); if(recOpen){ recOpen=null; return render(); } go('home'); }); }catch(e){} }
  if(NO_TG){ $('#app').innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:48px">📱</div><h3 style="margin:12px 0 6px">Откройте приложение в Telegram</h3><div class="mute small" style="margin-bottom:18px">Зайдите в бота @kult_tela_clients_bot и нажмите кнопку «Открыть» внизу чата. Если не открывается, обновите Telegram до последней версии</div><a class="btn" href="https://t.me/kult_tela_clients_bot">Перейти в бота</a></div>`; return; }
  render();
  try{ S=await api('me',{}); }
  catch(e){ $('#app').innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:48px">📡</div><h3 style="margin:12px 0 6px">Не получилось загрузить</h3><div class="mute small">Проверьте интернет и откройте ещё раз</div><button class="btn" style="margin-top:20px" onclick="location.reload()">Обновить</button></div>`; return; }
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get('page') || '';
  if(start.indexOf('care_')===0){ page='care'; sub=start.slice(5); }
  else if(start.indexOf('next_')===0 && S.client){ const p=procBy(start.slice(5)); return startBook({ cat:p?p.cat:null, next:true }); }
  else if(start==='cert'){ render(); return openCert(); }
  else if(['water','prog','food','care','book'].indexOf(start)>=0){ if(start==='book'&&S.client) return startBook(); page=start; }
  else if(params.get('p')) { page=params.get('p'); sub=params.get('s'); }
  render();
}
window.addEventListener('beforeunload', flushWater);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushWater(); });
init();
</script>
